    <!-- Non-blocking Third-Party Scripts: Google Analytics & AdSense loaded on interaction -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0YZ3Q025WF');

      // Load analytics and AdSense on first user interaction or delayed idle
      var thirdPartyLoaded = false;
      function loadThirdPartyScripts() {
        if (thirdPartyLoaded) return;
        thirdPartyLoaded = true;

        // Clean up listeners
        window.removeEventListener('scroll', loadThirdPartyScripts);
        window.removeEventListener('mousemove', loadThirdPartyScripts);
        window.removeEventListener('touchstart', loadThirdPartyScripts);
        window.removeEventListener('click', loadThirdPartyScripts);
        window.removeEventListener('keydown', loadThirdPartyScripts);

        // GTAG
        var gaScript = document.createElement('script');
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-0YZ3Q025WF';
        gaScript.async = true;
        document.head.appendChild(gaScript);

        // Google AdSense
        var adsScript = document.createElement('script');
        adsScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5135667808606813';
        adsScript.async = true;
        adsScript.crossOrigin = 'anonymous';
        document.head.appendChild(adsScript);
      }

      // Attach user interaction triggers
      window.addEventListener('scroll', loadThirdPartyScripts, { passive: true, once: true });
      window.addEventListener('mousemove', loadThirdPartyScripts, { passive: true, once: true });
      window.addEventListener('touchstart', loadThirdPartyScripts, { passive: true, once: true });
      window.addEventListener('click', loadThirdPartyScripts, { passive: true, once: true });
      window.addEventListener('keydown', loadThirdPartyScripts, { passive: true, once: true });

      // Fallback timer if user doesn't interact
      setTimeout(function() {
        if (!thirdPartyLoaded) {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadThirdPartyScripts, { timeout: 2000 });
          } else {
            loadThirdPartyScripts();
          }
        }
      }, 5000);
    </script>
